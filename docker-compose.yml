services:
  mysql:
    image: mysql:8.0
    container_name: breaddiary-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: breaddiary
      MYSQL_USER: appuser
      MYSQL_PASSWORD: "qwer123!@"
      MYSQL_ROOT_PASSWORD: "qwer123!@"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - breaddiary-mysql-data:/var/lib/mysql

volumes:
  breaddiary-mysql-data:
